<footer class="site-footer">

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col  footer-col-1">
        <ul class="contact-list">
          <li>
            <a href="mailto:{{ site.email }}"> 
              <span class="icon  icon--gmail">
                <svg >
                <img src="{{ site.baseurl }}/images/mail.png" width ="16" height="16" />
                </svg>
              </span>   
              <span class="username">Email</span>

            </a>
          </li>

                    {% if site.github_username %}
          <li>
            <a href="https://github.com/{{ site.github_username }}">
              <span class="icon  icon--github">
                <svg >
                <img src="{{ site.baseurl }}/images/GitHub-Mark-120px-plus.png" width ="16" height="16" />
                </svg>
              </span>
              <span class="username">Github</span>
            </a>
          </li>
                   {% endif %}

          {% if site.twitter_username %}
          <li>
            <a href="https://twitter.com/{{ site.twitter_username }}">
              <span class="icon  icon--twitter">
                <svg >
                <img src="{{ site.baseurl }}/images/twitter-512.png" width ="16" height="16" />
                </svg>
              </span>
              <span class="username">Twitter</span>
            </a>
          </li>
          {% endif %}


        </ul>
      </div>

      <div class="footer-col  footer-col-2">
                      <span class="icon icon-profile">

                <svg >
                <img src="{{ site.baseurl }}/images/profile_photo1.png" width ="70" height="70" />
                </svg>
                              </span>

      </div>

      <div class="footer-col  footer-col-3">
        <p class="text">{{ site.description }}</p>
      </div>
    </div>

  </div>

</footer>
